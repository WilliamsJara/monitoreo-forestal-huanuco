# Publica el tablero en http://<servidor>/carpeta/ (incluir dentro del bloque server { ... } del sitio)
location = /carpeta {
    return 301 /carpeta/;
}
location /carpeta/ {
    proxy_pass http://127.0.0.1:8501/carpeta/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;     # Streamlit usa WebSocket
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
    proxy_buffering off;
}
